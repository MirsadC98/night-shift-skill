<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' file:; style-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>night-shift</title>
<style>
:root {
  color-scheme: light dark;
  --night: #111a3b; --night-2: #1b2757; --night-line: #2e3c78; --on-night: #f4f6ff; --on-night-2: #aeb9e4;
  --ground: #f1f3f8; --panel: #ffffff; --panel-2: #f6f7fb; --ink: #0f1730; --ink-2: #4c5776; --line: #d5dae7; --line-2: #e7eaf2;
  --run: #2a49d6; --go: #14713a; --go-bg: #e1f3e7; --caution: #a55606; --caution-bg: #fbeed0; --stop: #c22020; --stop-bg: #fbe3e1;
  --down: #596277; --down-bg: #e3e6ee;
  --opus: #2a49d6; --sonnet: #0c8a79; --haiku: #cf3f77; --fable: #7a3fd1; --other: #6b7385;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --night: #0a0f24; --night-2: #141c40; --night-line: #26315f; --on-night: #eef1ff; --on-night-2: #9ba8d6;
    --ground: #0e1220; --panel: #151a2c; --panel-2: #1a2035; --ink: #e8ebf7; --ink-2: #9ba5c5; --line: #2a3250; --line-2: #212841;
    --run: #8198ff; --go: #4fc57e; --go-bg: #143524; --caution: #e7a440; --caution-bg: #382b10; --stop: #ff7d74; --stop-bg: #3d1716;
    --down: #9aa3b8; --down-bg: #222a3d;
    --opus: #8198ff; --sonnet: #3ec8b4; --haiku: #f07ba7; --fable: #b28bff; --other: #8c94a8;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--ground); scrollbar-color: var(--line) transparent; }
body { margin: 0; font: 14px/1.45 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
::selection { background: var(--run); color: #fff; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; border-radius: 4px; }
.shell :focus-visible { outline-color: var(--on-night); }
h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 28px; }

/* ---- shell ---- */
.shell { background: var(--night); color: var(--on-night); }
.bar { display: flex; align-items: center; gap: 16px; min-height: 44px; border-bottom: 1px solid var(--night-line); font-size: 13px; }
.bar .mark { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
.bar .mark svg { display: block; }
.bar nav { display: flex; gap: 2px; margin-left: 12px; }
.bar nav a { color: var(--on-night-2); text-decoration: none; padding: 5px 10px; border-radius: 6px; white-space: nowrap; }
.bar nav a:hover { color: var(--on-night); background: var(--night-2); }
.bar .meta { margin-left: auto; color: var(--on-night-2); text-align: right; }
.bar .tag { border: 1px solid var(--night-line); color: var(--on-night-2); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.head { padding: 22px 0 20px; }
.head h1 { font-size: 26px; line-height: 1.15; font-weight: 650; letter-spacing: -.02em; overflow-wrap: anywhere; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; color: var(--on-night-2); font-size: 14px; }
.state { display: inline-flex; align-items: center; gap: 7px; color: var(--on-night); font-weight: 600; }
.state i { width: 9px; height: 9px; border-radius: 50%; background: #58d68d; }
.state.is-wait i { background: #f0b445; } .state.is-stop i { background: #ff7d74; }
.state.is-done i { background: none; box-shadow: inset 0 0 0 2px #58d68d; }
.status q { quotes: "\201C" "\201D"; color: var(--on-night); overflow-wrap: anywhere; }
.status a { color: var(--on-night); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--on-night-2); }
.status a:hover { text-decoration-color: currentColor; }
.where { margin-top: 6px; color: var(--on-night-2); font-size: 13px; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 14px 0; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--night-line); }
.facts div { padding: 0 26px 0 0; margin-right: 26px; border-right: 1px solid var(--night-line); min-width: 0; }
.facts div:last-child { border-right: 0; margin-right: 0; }
.facts dt { font-size: 12px; color: var(--on-night-2); }
.facts dd { font-size: 16px; font-weight: 600; margin-top: 1px; white-space: nowrap; }
.facts dd small { display: block; font-size: 12px; font-weight: 400; color: var(--on-night-2); margin-top: 1px; min-height: 17px; }
.bar .age { margin-left: 9px; padding-left: 9px; border-left: 1px solid var(--night-line); }
.langs { display: inline-flex; align-items: center; gap: 2px; color: var(--night-line); white-space: nowrap; }
.langs button { font: inherit; font-size: 12.5px; color: var(--on-night-2); background: none; border: 1px solid transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.langs button:hover { color: var(--on-night); background: var(--night-2); }
.langs button[aria-pressed="true"] { color: var(--on-night); border-color: var(--night-line); }
.notice { margin: 0 0 18px; padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--caution); background: var(--caution-bg); color: var(--ink); font-size: 13.5px; overflow-wrap: anywhere; }
.notice code { white-space: nowrap; }
.now { padding: 14px 0 18px; border-top: 1px solid var(--night-line); color: var(--on-night-2); font-size: 13.5px; }
.now p { overflow-wrap: anywhere; }
.now p + p { margin-top: 3px; padding-left: 17px; }
.now b, .now q { color: var(--on-night); }
.now b { font-weight: 650; }
.now q { quotes: "\201C" "\201D"; }
.now .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: #58d68d; }
.now .dot.wait { background: #f0b445; }
.now .dot.idle { background: none; box-shadow: inset 0 0 0 2px var(--on-night-2); }

/* ---- work areas ---- */
main.wrap { padding-top: 24px; padding-bottom: 48px; }
.first { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 20px; align-items: stretch; margin-top: 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.panel > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 14px 18px 0; }
h2 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.hint { color: var(--ink-2); font-size: 13px; }
.run .readout { margin: 6px 18px 0; min-height: 21px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .readout b { color: var(--ink); font-weight: 600; }
.run .readout .sep { margin: 0 8px; color: var(--line); }
#run-plot { padding: 2px 6px 6px 8px; }
#run-plot svg { display: block; overflow: visible; cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 18px 14px; border-top: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: var(--run); }
.legend i.dash { height: 0; border-top: 1.5px dashed var(--ink-2); background: none; }
.legend i.box { width: 12px; height: 10px; border-radius: 2px; }
.legend i.limit { background: var(--caution-bg); border: 1px solid var(--caution); }
.legend i.down { background: var(--down-bg); border: 1px solid var(--down); }
.legend i.plan { height: 1px; background: var(--ink-2); opacity: .55; }
.legend i.model { background: var(--m); }
.legend i.diamond { width: 8px; height: 8px; border-radius: 0; background: var(--panel); border: 1.4px solid var(--ink); transform: rotate(45deg); margin: 0 3px; }

svg text { font-family: var(--font); font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
svg .axis { stroke: var(--line); stroke-width: 1; }
svg .grid { stroke: var(--line-2); stroke-width: 1; }
svg .midnight { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
svg .band-limit { fill: var(--caution-bg); } svg .band-down { fill: var(--down-bg); } svg .band-other { fill: var(--line-2); }
svg .band-label { font-size: 11px; font-weight: 600; }
svg .band-label.limit { fill: var(--caution); } svg .band-label.down { fill: var(--down); }
svg .work { stroke: var(--run); stroke-width: 2.6; stroke-linecap: round; fill: none; transition: stroke-width .15s; }
svg .work.hot { stroke-width: 5; }
svg .dwell { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; opacity: .75; }
svg .done { fill: var(--panel); stroke: var(--run); stroke-width: 1.4; }
svg .tip { fill: var(--m, var(--run)); stroke: var(--panel); stroke-width: 1.5; }
svg .expect { stroke: var(--ink-2); stroke-width: 1; fill: none; opacity: .55; }
svg .note { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; }
svg .lim5 { stroke: var(--caution); stroke-width: 1.6; fill: none; } svg .lim7 { stroke: var(--fable); stroke-width: 1.6; fill: none; }
svg .lab5 { fill: var(--caution); font-weight: 600; } svg .lab7 { fill: var(--fable); font-weight: 600; }
svg .cursor { stroke: var(--ink); stroke-width: 1; opacity: .5; pointer-events: none; }
svg .rowlabel { font-weight: 600; fill: var(--ink-2); }
.m-opus { --m: var(--opus); } .m-sonnet { --m: var(--sonnet); } .m-haiku { --m: var(--haiku); } .m-fable, .m-mythos { --m: var(--fable); } .m-other { --m: var(--other); }
svg .agent { fill: var(--m); } svg .work[class*="m-"] { stroke: var(--m); }

.waits ol { padding: 6px 18px 12px; counter-reset: w; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.waits ol li { position: relative; padding: 10px 0 10px 30px; border-top: 1px solid var(--line-2); font-size: 14px; overflow-wrap: anywhere; }
.waits ol li:nth-child(-n+2) { border-top: 0; }
.waits ol li::before { counter-increment: w; content: counter(w); position: absolute; left: 0; top: 11px; width: 20px; height: 20px; border-radius: 50%; background: var(--caution-bg); color: var(--caution); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.waits .older { padding: 0 18px 14px 48px; color: var(--ink-2); font-size: 13px; }
.waits h3 { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 12px 18px 0; border-top: 1px solid var(--line-2); }
.waits h3:first-child { border-top: 0; padding-top: 8px; }
.asks { padding: 4px 18px 12px; }
.asks li { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; font-size: 14px; overflow-wrap: anywhere; }
.asks li.answered .q { color: var(--ink-2); }
.empty { padding: 12px 18px 18px; color: var(--ink-2); font-size: 13.5px; }
.log { display: flex; flex-direction: column; min-height: 280px; }
.log ol { display: grid; grid-template-columns: 40px minmax(68px, max-content) minmax(0, 1fr); column-gap: 8px; align-content: start; flex: 1 1 0; min-height: 0; padding: 8px 18px 14px; overflow: auto; scrollbar-width: thin; }
.log li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; padding: 5px 0; font-size: 13px; }
.log .day { grid-column: 1 / -1; color: var(--ink-2); font-size: 12px; font-weight: 600; padding-top: 8px; }
.log time { color: var(--ink-2); }
.log .what { overflow-wrap: anywhere; }
.kind { font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 1px 6px; text-align: center; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--line-2); color: var(--ink-2); }
.kind.k-limit { background: var(--caution-bg); color: var(--caution); } .kind.k-down { background: var(--down-bg); color: var(--down); }
.kind.k-end, .kind.k-start { background: var(--go-bg); color: var(--go); } .kind.k-inbox { background: color-mix(in srgb, var(--run) 14%, var(--panel)); color: var(--run); }

/* ---- timetable ---- */
.table { margin-top: 20px; overflow: hidden; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 18px; }
.tools h2 { margin-right: auto; }
.tools input[type="search"] { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 240px; }
.tools input[type="search"]::placeholder { color: var(--ink-2); }
.tools label { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
.tools input[type="checkbox"] { accent-color: var(--run); width: 15px; height: 15px; margin: 0; }
.scroll { overflow-x: auto; scrollbar-width: thin; }
table { border-collapse: collapse; width: 100%; min-width: 980px; }
thead th { background: var(--panel-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: left; padding: 7px 10px; white-space: nowrap; }
thead th:first-child { padding-left: 18px; }
th.r, td.r { text-align: right; }
tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; }
tbody tr.row { cursor: pointer; transition: background .15s; }
tbody tr.row:hover, tbody tr.row.hot { background: color-mix(in srgb, var(--run) 6%, var(--panel)); }
tbody tr.row.open { background: var(--panel-2); }
td.no { width: 54px; padding-left: 18px; }
td.no button { font: inherit; font-weight: 650; color: var(--ink); background: none; border: 0; padding: 2px 4px; margin: -2px -4px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
td.no svg { transition: transform .15s; color: var(--ink-2); }
tr.open td.no svg { transform: rotate(90deg); }
td.piece { white-space: normal; min-width: 300px; max-width: 520px; }
td.piece .t { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
tr.open td.piece .t { -webkit-line-clamp: unset; }
.badges { display: inline-flex; gap: 5px; margin-left: 8px; vertical-align: 1px; }
.badge { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; line-height: 17px; white-space: nowrap; }
.badge.b-you { background: var(--caution-bg); color: var(--caution); } .badge.b-note { background: color-mix(in srgb, var(--run) 14%, var(--panel)); color: var(--run); }
.badge.b-again { background: var(--down-bg); color: var(--down); } .badge.b-run { background: var(--go-bg); color: var(--go); } .badge.b-guard { background: var(--stop-bg); color: var(--stop); }
td.when svg { display: block; }
td.when .track { fill: var(--line-2); } td.when .at { fill: var(--run); }
td.meter { position: relative; }
td.meter::after { content: ""; position: absolute; right: 10px; bottom: 3px; height: 2px; border-radius: 1px; width: calc(var(--v, 0) * (100% - 20px)); background: var(--run); opacity: .45; }
.mix { display: inline-flex; width: 44px; height: 6px; border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 8px; background: var(--line-2); }
.mix i { display: block; background: var(--m); }
tr.detail > td { padding: 0; white-space: normal; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.d { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 32px; padding: 14px 18px 20px 68px; }
.d h3 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.d li { font-size: 13px; padding: 2px 0; overflow-wrap: anywhere; }
.d .sub { color: var(--ink-2); }
.d p.sub { font-size: 13px; }
.d .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--m); margin-right: 7px; }
.d .tool { display: grid; grid-template-columns: 96px minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.d .tool span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d .tool b { height: 6px; border-radius: 3px; background: var(--run); opacity: .5; width: calc(var(--v) * 100%); }
.d .tool span:last-child { text-align: right; color: var(--ink-2); }
.d .wide { grid-column: span 2; }
.d svg { display: block; max-width: 100%; height: auto; }
.d svg .ctx { stroke: var(--run); stroke-width: 1.5; fill: none; }
.d svg .ctx-fill { fill: var(--run); opacity: .08; }
.none { padding: 22px 18px 26px; color: var(--ink-2); }
footer.wrap { color: var(--ink-2); font-size: 12.5px; padding-bottom: 36px; }
footer p + p { margin-top: 4px; }

@media (max-width: 1080px) {
  .first { grid-template-columns: minmax(0, 1fr); }
  .log { min-height: 0; }
  .log ol { flex: none; max-height: 330px; }
  .d { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-left: 18px; }
}
@media (max-width: 680px) {
  .wrap { padding: 0 14px; }
  .bar nav { display: none; }
  .bar { flex-wrap: wrap; gap: 4px 12px; padding: 6px 0; }
  .head h1 { font-size: 22px; }
  .facts { gap: 14px 22px; }
  .facts div { border-right: 0; margin-right: 0; padding-right: 0; }
  .waits ol { grid-template-columns: minmax(0, 1fr); }
  .waits ol li:nth-child(2) { border-top: 1px solid var(--line-2); }
  .d { grid-template-columns: minmax(0, 1fr); }
  .d .wide { grid-column: auto; }
  .tools input[type="search"] { width: 100%; }
  .run .readout { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <div class="wrap">
    <div class="bar">
      <span class="mark">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 14 L6 14 L8 9 L11 9 L13 4 L16 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        night-shift
      </span>
      <nav id="nav"><a href="#you" id="nav-you"></a><a href="#run" id="nav-run"></a><a href="#log" id="nav-log"></a><a href="#sessions" id="nav-ses"></a></nav>
      <span class="meta"><span id="snap"></span><span class="age" id="age" hidden></span></span>
      <span class="tag" id="tag" hidden></span>
      <span class="langs" id="langs" role="group" hidden></span>
    </div>
    <div class="head">
      <h1 id="project"></h1>
      <p class="status" id="status"></p>
      <p class="where" id="where"></p>
      <dl class="facts" id="facts"></dl>
    </div>
    <p class="notice" id="notice" role="status" hidden></p>
    <div class="now" id="now" hidden></div>
  </div>
</div>

<main class="wrap">
  <section class="panel waits" id="you" aria-labelledby="you-h">
    <header><h2 id="you-h"></h2><span class="hint" id="you-n"></span></header>
    <div id="waits"></div>
  </section>
  <div class="first">
    <section class="panel run" id="run" aria-labelledby="run-h">
      <header><h2 id="run-h"></h2><span class="hint" id="run-hint"></span></header>
      <p class="readout" id="readout" aria-live="off"></p>
      <figure id="run-plot"></figure>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel log" id="log" aria-labelledby="log-h">
      <header><h2 id="log-h"></h2><span class="hint" id="log-hint"></span></header>
      <ol id="events"></ol>
    </section>
  </div>

  <section class="panel table" id="sessions" aria-labelledby="ses-h">
    <div class="tools">
      <h2 id="ses-h"></h2>
      <label><input type="checkbox" id="only-you"><span id="only-you-l"></span></label>
      <input type="search" id="find">
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th scope="col" id="c-no"></th><th scope="col" id="c-piece"></th><th scope="col" id="c-when"></th><th scope="col" class="r" id="c-start"></th>
          <th scope="col" class="r" id="c-ran"></th><th scope="col" class="r" id="c-cost"></th><th scope="col" class="r" id="c-peak"></th><th scope="col" id="c-agents"></th><th scope="col" class="r" id="c-commits"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="none" id="no-rows" hidden></p>
    </div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>

<script type="application/json" id="chain-data">/*__DATA__*/</script>
<script type="application/json" id="labels">/*__LABELS__*/</script>
<script>
(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const keep = (kids) => [].concat(kids).filter((k) => k != null && k !== false && k !== "");
  // Every string goes in as text or as an attribute's value, never as markup.
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);

    noticeKey = "";
    drawWords(); drawShell(); drawLangs(); drawTop(); drawWaits(); drawLog(); drawLegend(); drawRun(true); drawSessions(); readoutIdle();
    // a redraw replaces the row a keyboard user stood on, and must not move the page under the reader
    if (focus && document.activeElement?.id !== focus) $(focus)?.focus({ preventScroll: true });
    if (scrollX !== x || scrollY !== y) scrollTo(x, y);
  }
  $("find").addEventListener("input", () => { ui.search = $("find").value; applyFilter(); });
  $("only-you").addEventListener("change", () => { ui.filter = $("only-you").checked; applyFilter(); });
  setLang(ui.lang);

  setInterval(tick, 1000);
  pollOnce();
})();
