name: Bug report
description: Something the runner, the guard, the report or the skill did wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem goes by the repository's security policy (SECURITY.md, under the Security tab) instead, not a public issue. Remove tokens, chat ids and private paths from what you paste.
  - type: input
    id: version
    attributes:
      label: Version
      description: "What `node <skill folder>/scripts/night-chain.mjs --version` prints."
      placeholder: "night-shift x.y.z"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor's output
      description: "What `node <skill folder>/scripts/night-chain.mjs doctor --repo <repository>` prints, run on the repository the problem happened in."
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked for, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The lines of the state folder's `chain.log` around the problem, and the night report's section if it matters."
      render: text
  - type: input
    id: system
    attributes:
      label: System
      description: "The Windows version, `node --version` and `claude --version`."
